<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link id="favicon" rel="apple-touch-icon" href="">
    <meta id="app-title-meta" name="apple-mobile-web-app-title" content="">
    
    <title id="site-title">陰府怪奇譚</title>
    <style>
        body { background: #1a1c1e; color: #ffffff; font-family: sans-serif; margin: 0; padding: 15px 15px 350px 15px; }
        .log-item { display: flex; background: #2c2f33; padding: 12px; border-radius: 8px; margin-bottom: 12px; position: relative; }
        .log-icon img { width: 84px; height: 84px; border-radius: 6px; margin-right: 12px; object-fit: cover; }
        .log-content { flex: 1; min-width: 0; }
        .log-header { font-weight: bold; border-bottom: 1px solid #444; margin-bottom: 5px; padding-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
        .log-time { font-size: 0.75em; color: #888; font-weight: normal; margin-right: 25px; }
        .log-text { white-space: pre-wrap; line-height: 1.5; word-break: break-all; }
        .log-image { margin-top: 10px; max-width: 100%; max-height: 300px; border-radius: 6px; display: block; object-fit: contain; }
        .del-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #666; font-size: 18px; cursor: pointer; padding: 5px; }
        
        /* ページネーション用スタイル */
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; background: #2c2f33; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; gap: 5px; flex-wrap: wrap; }
        .pagination-bar button { background: #444; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .pagination-bar button:disabled { background: #222; color: #555; cursor: default; }
        .pagination-bar select { background: #333; color: white; border: 1px solid #555; border-radius: 4px; padding: 4px 6px; font-size: 12px; }

        large { font-size: 1.3em; font-weight: bold; }
        small { font-size: 0.8em; color: #ccc; }
        b { font-weight: bold; }
        i { font-style: italic; }
        rainbow { background: linear-gradient(to right, #ff7f7f, #ffbf7f, #ffff7f, #7fff7f, #7f7fff, #bf7fff, #ff7fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; }
        
        .footer-control { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1c1e; border-top: 1px solid #444; padding: 12px; z-index: 1000; }
        .char-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .active-icon { width: 66px; height: 66px; border-radius: 6px; border: 2px solid #7f7fff; background: #333; object-fit: cover; }
        .tab-scroll { display: flex; gap: 5px; overflow-x: auto; flex: 1; }
        .tab-item { background: #444; border: none; color: white; padding: 6px 12px; border-radius: 4px; white-space: nowrap; }
        .tab-item.on { background: #7f7fff; }
        
        .time-setting-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: #aaa; }
        .time-setting-row input { background: #333; color: white; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; font-size: 12px; width: 80px; }

        textarea { width: 100%; height: 70px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; padding: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-row { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
        .btn-row button { flex: 1; min-width: 40px; padding: 8px 2px; border: none; border-radius: 4px; background: #444; color: white; font-size: 12px; }
        
        #mask { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; }
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 85%; max-height: 70%; background: #2c2f33; border-radius: 12px; padding: 20px; overflow-y: auto; z-index: 2100; }
        .icon-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .icon-grid img { width: 60px; height: 60px; border-radius: 4px; border: 2px solid transparent; object-fit: cover; }
        
        .screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1c1e; z-index: 3000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .field input, .field textarea { width: 100%; background: #333; color: white; border: 1px solid #555; padding: 10px; box-sizing: border-box; border-radius: 4px; }
        
        .manage-card { background: #2c2f33; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .manage-icons { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .mini-icon { position: relative; width: 45px; height: 45px; }
        .mini-icon img { width: 100%; height: 100%; border-radius: 4px; object-fit: cover; }
        .mini-del { position: absolute; top: -5px; right: -5px; background: #ff4f4f; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; display: flex; align-items: center; justify-content: center; border: none; }
        
        details { background: #2c2f33; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        summary { padding: 12px; cursor: pointer; font-weight: bold; background: #3a3f44; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 12px; color: #888; }
        details[open] summary::after { content: '▲'; }
    </style>
</head>
<body>

    <!-- ページネーション用コンテナ（スクショ保存ボタン付き） -->
    <div id="pagination-top" class="pagination-bar" style="display:none;">
        <div style="display: flex; gap: 5px; align-items: center;">
            <button id="prev-btn" onclick="changePage(-1)">◀ 前へ</button>
            <select id="page-select" onchange="jumpPage(this.value)"></select>
            <span id="page-total" style="color:#aaa; font-size:12px;"></span>
            <button id="next-btn" onclick="changePage(1)">次へ ▶</button>
        </div>
        <button onclick="saveCurrentPageAsImage()" style="background:#7f7fff; font-weight:bold;">📷 スクショ保存</button>
    </div>

    <div id="logs"></div>

    <!-- 下部コントロール -->
    <div class="footer-control">
        <div class="char-row">
            <img id="now-icon" src="" class="active-icon" onclick="toggleModal(true)">
            <div class="tab-scroll" id="tabs"></div>
            <button onclick="toggleScreen('config-screen')" style="background:none; border:1px solid #777; color:#ccc; border-radius:4px; padding:5px;">⚙️</button>
        </div>
        
        <div class="time-setting-row">
            <span>投稿時間:</span>
            <input type="text" id="custom-time" placeholder="例: 21:48">
            <span style="font-size: 10px; color: #777;">（空欄なら現在時刻）</span>
        </div>

        <textarea id="text-in" placeholder="メッセージを入力（画像URLを貼ると画像も出せるよ）"></textarea>
        <div class="btn-row">
            <button onclick="tag('large')">L</button>
            <button onclick="tag('small')">S</button>
            <button onclick="tag('b')"><b>B</b></button>
            <button onclick="tag('i')"><i>I</i></button>
            <button onclick="tag('rainbow')">🌈</button>
            <button onclick="tagRuby()">ルビ</button>
            <button onclick="post()" style="background:#fff; color:#000; font-weight:bold; flex: 2; font-size: 14px;">投稿</button>
        </div>
    </div>

    <div id="mask" onclick="toggleModal(false)"></div>
    <div id="modal">
        <h4 style="margin-top:0">アイコン選択</h4>
        <div class="icon-grid" id="icon-list"></div>
    </div>

    <div id="config-screen" class="screen">
        <h3 style="font-size: 18px; margin-top: 0;">データ保存・読み込み</h3>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
            <div style="display: flex; gap: 4px;">
                <button onclick="exportToFile('all')" style="background: #4a4a4a; flex: 1; padding: 10px; font-size: 13px; color: white; border: none; border-radius: 4px;">全ログ保存</button>
                <button onclick="exportToFile('today')" style="background: #4a4a4a; flex: 1; padding: 10px; font-size: 13px; color: white; border: none; border-radius: 4px;">今日のみ保存</button>
            </div>
            <button onclick="document.getElementById('importFile').click()" style="background: #7f7fff; width:100%; padding: 10px; font-size: 14px; color: white; border: none; border-radius: 4px;">JSONファイルを読み込む</button>
            <button onclick="toggleScreen('backup-screen')" style="width:100%; padding:10px; background:#333; color:#fff; border:1px solid #555; border-radius:4px;">テキストコピペ画面へ</button>
            <button onclick="clearAllLogs()" style="width:100%; padding:10px; background:#8b0000; color:#fff; border:none; border-radius:4px; font-weight:bold; margin-top:5px;">全投稿を一括削除する</button>
        </div>
        <input type="file" id="importFile" style="display:none" onchange="importFromFile(this)" accept=".json">

        <hr style="margin:20px 0; border:0; border-top:1px solid #444;">

        <h3>サイト設定</h3>
        <div class="field"><label>サイトタイトル</label><input type="text" id="setting-title" placeholder="陰府怪奇譚"></div>
        <div class="field"><label>ブックマーク用アイコンURL</label><input type="text" id="setting-icon" placeholder="https://..."></div>
        <button onclick="saveSiteSettings()" style="width:100%; padding:10px; background:#444; color:white; border:none; border-radius:4px; margin-bottom:20px;">サイト設定を保存</button>

        <hr style="margin:20px 0; border:0; border-top:1px solid #444;">

        <h3>キャラクター新規登録・更新</h3>
        <div class="field"><label>名前</label><input type="text" id="c-name"></div>
        <div class="field"><label>アイコンURL（改行区切り）</label><textarea id="c-urls" style="height:100px;" placeholder="https://..."></textarea></div>
        <button onclick="saveChar()" style="width:100%; padding:12px; background:#7f7fff; color:white; border:none; border-radius:4px; font-weight:bold;">登録・更新</button>
        
        <h3 style="margin-top: 25px;">登録済みキャラ一覧</h3>
        <div id="char-list-ui"></div>

        <button onclick="toggleScreen('')" style="width:100%; padding:12px; background:#555; color:white; border:none; border-radius:4px; margin-top:20px; font-weight:bold;">閉じる</button>
    </div>

    <div id="backup-screen" class="screen">
        <h3>テキスト管理（JSON）</h3>
        <textarea id="backup-data" style="height:250px; font-size:10px; width: 100%; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #444;"></textarea>
        <div class="btn-row">
            <button onclick="exportToTextarea()" style="background:#444;">テキスト生成</button>
            <button onclick="importFromTextarea()" style="background:#ff4f4f;">復元（上書き）</button>
        </div>
        <button onclick="toggleScreen('config-screen')" style="width:100%; padding:10px; background:#555; color:white; border:none; border-radius:4px; margin-top:20px;">戻る</button>
    </div>

    <script>
        // 保栖（58枚）の自動生成設定
        let initialChars = {};
        let hosumiImages = [];
        for(let i = 1; i <= 58; i++) {
            hosumiImages.push(`https://raw.githubusercontent.com/kei/hosumi/main/hosumi1-${i}.png`);
        }
        initialChars["保栖"] = hosumiImages;

        let chars = JSON.parse(localStorage.getItem('vkk_chars') || JSON.stringify(initialChars));
        let settings = JSON.parse(localStorage.getItem('vkk_settings') || '{"title":"陰府怪奇譚","icon":"https://www.rabbithutch.site/usagoya/picture.php?user=chibichans&file=IMG_2148.webp"}');
        let currentName = ''; 
        let currentImg = '';
        
        let currentPage = 1;
        const itemsPerPage = 10;

        window.onload = () => { 
            applySiteSettings();
            buildTabs(); 
            renderAllLogs(); 
        };

        function applySiteSettings() {
            document.getElementById('site-title').innerText = settings.title;
            document.getElementById('setting-title').value = settings.title;
            document.getElementById('setting-icon').value = settings.icon;
            document.getElementById('favicon').href = settings.icon;
            document.getElementById('app-title-meta').content = settings.title;
        }

        function saveSiteSettings() {
            settings.title = document.getElementById('setting-title').value.trim() || '陰府怪奇譚';
            settings.icon = document.getElementById('setting-icon').value.trim();
            localStorage.setItem('vkk_settings', JSON.stringify(settings));
            applySiteSettings();
            alert('設定を保存したで……');
        }

        function clearAllLogs() {
            if(confirm('今までの投稿を全部消してもええの？\n（この操作は取り消せへんよ）')) {
                localStorage.setItem('vkk_logs', '[]');
                currentPage = 1;
                renderAllLogs();
                alert('全部きれいに消しといたわ……');
            }
        }

        function toggleScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            if(id) {
                document.getElementById(id).style.display = 'block';
                if(id === 'config-screen') buildManageList();
            }
        }

        function toggleModal(show) {
            document.getElementById('mask').style.display = show ? 'block' : 'none';
            document.getElementById('modal').style.display = show ? 'block' : 'none';
            if(show) buildIconGrid();
        }

        function saveChar() {
            const n = document.getElementById('c-name').value.trim();
            const u = document.getElementById('c-urls').value.split('\n').filter(x => x.trim());
            if(!n || !u.length) return alert('名前とURLを入力してください');
            if (!chars[n]) chars[n] = [];
            chars[n] = Array.from(new Set([...chars[n], ...u]));
            localStorage.setItem('vkk_chars', JSON.stringify(chars));
            alert(n + ' を更新したで');
            document.getElementById('c-name').value = '';
            document.getElementById('c-urls').value = '';
            buildTabs();
            buildManageList();
        }

        function buildTabs() {
            const area = document.getElementById('tabs'); area.innerHTML = '';
            const names = Object.keys(chars);
            names.forEach(n => {
                const b = document.createElement('button');
                b.className = 'tab-item' + (currentName === n ? ' on' : '');
                b.innerText = n;
                b.onclick = () => { 
                    currentName = n; 
                    currentImg = chars[n][0]; 
                    document.getElementById('now-icon').src = currentImg; 
                    buildTabs(); 
                };
                area.appendChild(b);
            });
            if(!currentName && names.length) {
                currentName = names[0]; currentImg = chars[currentName][0];
                document.getElementById('now-icon').src = currentImg; buildTabs();
            }
        }

        function buildIconGrid() {
            const grid = document.getElementById('icon-list'); grid.innerHTML = '';
            if(!currentName || !chars[currentName]) return;
            chars[currentName].forEach(u => {
                const img = document.createElement('img');
                img.src = u;
                if(u === currentImg) img.style.borderColor = '#7f7fff';
                img.onclick = () => { currentImg = u; document.getElementById('now-icon').src = u; toggleModal(false); };
                grid.appendChild(img);
            });
        }

        function post() {
            const val = document.getElementById('text-in').value.trim();
            if(!val || !currentName) return;

            let timeStr = document.getElementById('custom-time').value.trim();
            if(!timeStr) {
                const now = new Date();
                timeStr = `${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
            }

            const todayStr = new Date().toISOString().split('T')[0];

            let textContent = val;
            let imageUrl = '';

            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const matches = val.match(urlRegex);
            
            if (matches) {
                const imgMatch = matches.find(url => /\.(jpg|jpeg|png|webp|gif)(?:[?#]|$)/i.test(url) || url.includes('picture.php'));
                if (imgMatch) {
                    imageUrl = imgMatch;
                    textContent = val.replace(imgMatch, '').trim();
                }
            }

            const data = { 
                n: currentName, 
                i: currentImg, 
                t: timeStr, 
                d: todayStr, 
                b: textContent,
                img: imageUrl 
            };

            let logs = JSON.parse(localStorage.getItem('vkk_logs') || '[]');
            logs.push(data);
            localStorage.setItem('vkk_logs', JSON.stringify(logs));
            
            const totalPages = Math.max(1, Math.ceil(logs.length / itemsPerPage));
            currentPage = totalPages;

            renderAllLogs();
            
            document.getElementById('text-in').value = '';
            document.getElementById('custom-time').value = '';
            window.scrollTo(0, 0);
        }

        function renderAllLogs() {
            let logs = JSON.parse(localStorage.getItem('vkk_logs') || '[]');
            const totalPages = Math.max(1, Math.ceil(logs.length / itemsPerPage));
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const paginationTop = document.getElementById('pagination-top');
            if (logs.length > 0) {
                paginationTop.style.display = 'flex';
                document.getElementById('prev-btn').disabled = (currentPage <= 1);
                document.getElementById('next-btn').disabled = (currentPage >= totalPages);
                document.getElementById('page-total').innerText = `/ ${totalPages} ページ`;

                const pageSelect = document.getElementById('page-select');
                pageSelect.innerHTML = '';
                for(let p = 1; p <= totalPages; p++) {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.innerText = p;
                    if(p === currentPage) opt.selected = true;
                    pageSelect.appendChild(opt);
                }
            } else {
                paginationTop.style.display = 'none';
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const targetLogs = logs.slice(startIndex, endIndex);

            const area = document.getElementById('logs'); 
            area.innerHTML = '';

            targetLogs.forEach((d, subIndex) => {
                const globalIndex = startIndex + subIndex;
                let imageHtml = d.img ? `<img src="${d.img}" class="log-image">` : '';

                const html = `<div class="log-item">
                    <button class="del-btn" onclick="deleteLog(${globalIndex})">×</button>
                    <div class="log-icon"><img src="${d.i}"></div>
                    <div class="log-content">
                        <div class="log-header"><span>${d.n}</span><span class="log-time">${d.t}</span></div>
                        <div class="log-text">${d.b}</div>
                        ${imageHtml}
                    </div>
                </div>`;
                area.insertAdjacentHTML('beforeend', html);
            });
        }

        function changePage(direction) {
            currentPage += direction;
            renderAllLogs();
            window.scrollTo(0, 0);
        }

        function jumpPage(pageVal) {
            currentPage = parseInt(pageVal);
            renderAllLogs();
            window.scrollTo(0, 0);
        }

        function deleteLog(i) { 
            if(confirm('このログを削除する？')) { 
                let logs = JSON.parse(localStorage.getItem('vkk_logs') || '[]'); 
                logs.splice(i, 1); 
                localStorage.setItem('vkk_logs', JSON.stringify(logs)); 
                renderAllLogs(); 
            } 
        }

        // --- Canvasを使ったスクショ表示・保存機能（プレビュー長押し保存方式） ---
        async function saveCurrentPageAsImage() {
            let logs = JSON.parse(localStorage.getItem('vkk_logs') || '[]');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const targetLogs = logs.slice(startIndex, startIndex + itemsPerPage);
            if(targetLogs.length === 0) return alert('保存するログがないわ……');

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const width = 800;
            canvas.width = width;
            
            let padding = 20;
            let itemHeights = [];
            
            ctx.font = '16px sans-serif';
            
            targetLogs.forEach(d => {
                const maxWidth = width - 150; 
                const lines = wrapText(ctx, d.b, maxWidth);
                let h = 24 + (lines.length * 24) + 30; 
                if(d.img) h += 220; 
                if(h < 110) h = 110; 
                itemHeights.push({ h: h, lines: lines, data: d });
                padding += h + 12; 
            });

            canvas.height = padding + 20;

            ctx.fillStyle = '#1a1c1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let currentY = 20;

            for(let item of itemHeights) {
                let d = item.data;
                let h = item.h;

                ctx.fillStyle = '#2c2f33';
                roundRect(ctx, 20, currentY, width - 40, h, 8, true, false);

                try {
                    await drawImageToCanvas(ctx, d.i, 32, currentY + 12, 84, 84, 6);
                } catch(e) {
                    ctx.fillStyle = '#444';
                    ctx.fillRect(32, currentY + 12, 84, 84);
                }

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(d.n, 128, currentY + 30);

                ctx.fillStyle = '#888888';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(d.t, width - 40, currentY + 30);
                ctx.textAlign = 'left';

                ctx.strokeStyle = '#444444';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(128, currentY + 42);
                ctx.lineTo(width - 40, currentY + 42);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = '16px sans-serif';
                let textY = currentY + 68;
                for(let line of item.lines) {
                    ctx.fillText(line, 128, textY);
                    textY += 24;
                }

                if(d.img) {
                    try {
                        await drawImageToCanvas(ctx, d.img, 128, textY + 5, width - 168, 200, 6);
                    } catch(e) {
                        ctx.fillStyle = '#444';
                        ctx.fillRect(128, textY + 5, width - 168, 200);
                    }
                }

                currentY += h + 12;
            }

            try {
                const dataUrl = canvas.toDataURL('image/png');
                
                let oldModal = document.getElementById('screenshot-modal');
                if(oldModal) oldModal.remove();

                const previewModal = document.createElement('div');
                previewModal.id = 'screenshot-modal';
                previewModal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;';
                
                previewModal.innerHTML = `
                    <div style="color:white; margin-bottom:10px; font-size:14px; text-align:center;">
                        画像を長押しして「写真に追加」または「保存」してな！
                    </div>
                    <img src="${dataUrl}" style="max-width:100%; max-height:75vh; border-radius:8px; object-fit:contain; border:1px solid #555;">
                    <button onclick="document.getElementById('screenshot-modal').remove()" style="margin-top:15px; background:#ff4f4f; color:white; border:none; padding:10px 20px; border-radius:4px; font-weight:bold;">閉じる</button>
                `;
                document.body.appendChild(previewModal);

            } catch(err) {
                alert('画像生成に失敗したわ……。');
            }
        }

        // テキスト折り返し用ヘルパー
        function wrapText(ctx, text, maxWidth) {
            let lines = [];
            let paragraphs = text.split('\n');
            paragraphs.forEach(para => {
                let line = '';
                for(let i = 0; i < para.length; i++) {
                    let testLine = line + para[i];
                    let metrics = ctx.measureText(testLine);
                    if(metrics.width > maxWidth && i > 0) {
                        lines.push(line);
                        line = para[i];
                    } else {
                        line = testLine;
                    }
                }
                lines.push(line);
            });
            return lines;
        }

        // 角丸矩形描画ヘルパー
        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        // アイコン・画像描画用ヘルパー
        function drawImageToCanvas(ctx, src, x, y, w, h, radius) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x + radius, y);
                    ctx.lineTo(x + w - radius, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
                    ctx.lineTo(x + w, y + h - radius);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
                    ctx.lineTo(x + radius, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
                    ctx.lineTo(x, y + radius);
                    ctx.quadraticCurveTo(x, y, x + radius, y);
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(img, x, y, w, h);
                    ctx.restore();
                    resolve();
                };
                img.onerror = () => { resolve(); };
                img.src = src;
            });
        }
        // --- ここまで ---

        function buildManageList() {
            const area = document.getElementById('char-list-ui'); if(!area) return;
            area.innerHTML = '';
            Object.keys(chars).forEach(name => {
                const details = document.createElement('details');
                details.innerHTML = `
                    <summary>
                        <span>${name} (${chars[name].length})</span>
                        <button onclick="delChar(event, '${name}')" style="color:#ff4f4f; background:none; border:none; font-size:12px; margin-right:10px;">削除</button>
                    </summary>
                    <div style="padding:10px; background:#222;">
                        <div class="manage-icons"></div>
                    </div>
                `;
                
                const iconContainer = details.querySelector('.manage-icons');
                chars[name].forEach((url, idx) => {
                    const iconBox = document.createElement('div');
                    iconBox.className = 'mini-icon';
                    iconBox.innerHTML = `
                        <img src="${url}">
                        <button class="mini-del" onclick="delIcon('${name}', ${idx})">×</button>
                    `;
                    iconContainer.appendChild(iconBox);
                });
                
                area.appendChild(details);
            });
        }

        function delIcon(name, idx) {
            if(confirm('このアイコンを削除する？')) {
                chars[name].splice(idx, 1);
                if(chars[name].length === 0) delete chars[name];
                localStorage.setItem('vkk_chars', JSON.stringify(chars));
                buildManageList();
                buildTabs();
            }
        }

        function delChar(event, n) {
            event.stopPropagation();
            if(confirm(n + ' を削除する？全アイコンが消えるよ')){
                delete chars[n];
                localStorage.setItem('vkk_chars', JSON.stringify(chars));
                buildManageList();
                buildTabs();
            }
        }

        function exportToFile(mode) {
            let logs = JSON.parse(localStorage.getItem('vkk_logs') || '[]');
            let filename = 'vkk_archive_all.json';
            if(mode === 'today') {
                const today = new Date().toISOString().split('T')[0];
                logs = logs.filter(l => l.d === today);
                filename = 'vkk_archive_today.json';
            }
            const data = { logs: logs, chars: chars, settings: settings };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importFromFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (confirm('現在のデータに上書きする？')) {
                        localStorage.setItem('vkk_logs', JSON.stringify(data.logs || []));
                        localStorage.setItem('vkk_chars', JSON.stringify(data.chars || {}));
                        if(data.settings) localStorage.setItem('vkk_settings', JSON.stringify(data.settings));
                        location.reload();
                    }
                } catch (err) { alert('ファイルの形式がおかしいみたいやわ……'); }
            };
            reader.readAsText(file);
        }

        function exportToTextarea() {
            const data = { logs: JSON.parse(localStorage.getItem('vkk_logs') || '[]'), chars: chars, settings: settings };
            document.getElementById('backup-data').value = JSON.stringify(data, null, 2);
        }

        function importFromTextarea() {
            const jsonText = document.getElementById('backup-data').value;
            try {
                const data = JSON.parse(jsonText);
                if (confirm('上書きする？')) {
                    localStorage.setItem('vkk_logs', JSON.stringify(data.logs || []));
                    localStorage.setItem('vkk_chars', JSON.stringify(data.chars || {}));
                    if(data.settings) localStorage.setItem('vkk_settings', JSON.stringify(data.settings));
                    location.reload();
                }
            } catch (err) { alert('形式エラーやわ……'); }
        }

        function tag(s) {
            const el = document.getElementById('text-in');
            const start = el.selectionStart;
            const end = el.selectionEnd;
            const txt = el.value;
            el.value = txt.substring(0, start) + `<${s}>` + txt.substring(start, end) + `</${s}>` + txt.substring(end);
            el.focus();
        }
        function tagRuby() {
            const el = document.getElementById('text-in');
            const start = el.selectionStart;
            const end = el.selectionEnd;
            const txt = el.value;
            el.value = txt.substring(0, start) + `<ruby>` + txt.substring(start, end) + `<rt>ルビ</rt></ruby>` + txt.substring(end);
            el.focus();
        }
    </script>
